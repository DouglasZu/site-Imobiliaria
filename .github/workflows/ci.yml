name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.db
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      WHATSAPP_PHONE: "5500000000000"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Verify migration history matches the schema
        run: npx prisma migrate diff --exit-code --from-migrations prisma/migrations --to-schema prisma/schema.prisma

      - name: Initialize clean SQLite database
        run: node -e "const Database = require('better-sqlite3'); const db = new Database('ci.db'); db.close()"

      - name: Verify migrations on a clean database
        run: npm run db:deploy

      - name: Seed deterministic E2E fixtures
        run: npm run seed
        env:
          ADMIN_EMAIL: ci-admin@example.test
          ADMIN_PASSWORD: "Ci-only-Strong-Password!2026"
          SEED_REPLACE_CONFIRM: REPLACE_CATALOG_AND_ADMINS

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Chromium for E2E tests
        run: npx playwright install --with-deps chromium

      - name: E2E tests against production server
        run: npm run test:e2e
        env:
          PLAYWRIGHT_PRODUCTION: "1"
          ADMIN_EMAIL: ci-admin@example.test
          ADMIN_PASSWORD: "Ci-only-Strong-Password!2026"

      - name: Audit dependencies
        run: npm audit --audit-level=high
