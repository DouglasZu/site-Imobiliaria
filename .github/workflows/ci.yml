name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lar_imoveis_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lar_imoveis_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lar_imoveis_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/lar_imoveis_ci?schema=public
      DATABASE_ADAPTER: pg
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      WHATSAPP_PHONE: "5500000000000"
      SITE_URL: http://localhost:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject SQLite SQL in the PostgreSQL history
        run: |
          if grep -R -E 'PRAGMA|AUTOINCREMENT|DATETIME' prisma/migrations-postgresql; then
            echo "SQLite-only SQL found in PostgreSQL migrations"
            exit 1
          fi

      - name: Validate and generate Prisma Client
        run: |
          npx prisma validate
          npx prisma generate

      - name: Deploy migrations to a clean PostgreSQL database
        run: npm run db:deploy

      - name: Verify migration status and schema drift
        run: |
          npx prisma migrate status
          npx prisma migrate diff --exit-code --from-config-datasource --to-schema prisma/schema.prisma

      - name: Seed deterministic E2E fixtures without deleting unrelated data
        run: npm run seed
        env:
          NODE_ENV: test
          ADMIN_EMAIL: ci-admin@example.test
          ADMIN_PASSWORD: "Ci-only-Strong-Password!2026"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Chromium for E2E tests
        run: npx playwright install --with-deps chromium

      - name: E2E tests against production server
        run: npm run test:e2e
        env:
          PLAYWRIGHT_PRODUCTION: "1"
          ADMIN_EMAIL: ci-admin@example.test
          ADMIN_PASSWORD: "Ci-only-Strong-Password!2026"

      - name: Audit dependencies
        run: npm audit --audit-level=high
